# Steam notification toasts
[[window_rule]]
match.title = "^notificationtoasts"
default_floating = true
default_focused = false
default_position = { x = 0, y = 0, anchor = "top_right" }

[[window_rule]]
match.app_id = ["^steam_app_\\d+$", "^Slay the Spire 2$", "^cs2$"]
default_fullscreen = true
default_output = "Microstep MPG341CX OLED Unknown"
vrr = "always"
opacity = 1.0

[[window_rule]]
match.app_id = "^org.gnome.Nautilus$"
default_floating = true
default_floating_size = { width = 0.4, height = 0.6 }

[[window_rule]]
match.app_id = ["^Alacritty$", "^vesktop$", "^discord$"]
default_scrolling_extent = 0.33
blur = false

# Discord popups (anything not the main "... - Discord" window) stay opaque.
[[window_rule]]
match.app_id = "^(discord|vesktop)$"
match.title = "^(?!.*- Discord$)"
opacity = 1.0

[[window_rule]]
match.app_id = "^dev.zed.Zed$"
default_scrolling_extent = 0.75

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_floating_size = { width = 0.25, height = 0.336 }
default_position = { x = 0, y = 0, anchor = "bottom_right" }
opacity = 1.0

[[window_rule]]
match.app_id = ["^dev.noctalia.Noctalia.Settings$", "^dev.noctalia.Noctalia$"]
default_floating = true
default_floating_size_px = { width = 1080, height = 920 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.app_id = "^org\\.pulseaudio\\.pavucontrol$"
default_floating = true
default_floating_size_px = { width = 1200, height = 1100 }
opacity = 0.75

# Layer rules ------------------------------------------------------------------

# niri kept noctalia's bar/dock/panels unblurred; same here.
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel)$"
blur = false
