# Window and layer rules, ported from configs/niri/rules.kdl.
# Every matching rule applies; later rules win for the same key.

# Base look for every window: translucent, blurred.
[[window_rule]]
opacity = 0.95
blur = true

[[window_rule]]
match.is_focused = false
opacity = 0.78

[[window_rule]]
match.app_id = "^Minecraft"
default_floating = true
default_floating_size = { width = 0.85, height = 0.95 }

# Media and games stay fully opaque, no blur.
[[window_rule]]
match.app_id = [
    "^Minecraft.*",
    "^jellyfin-desktop$",
    "^org.jellyfin.JellyfinDesktop$",
    "^imv$",
    "^mpv$",
]
opacity = 1.0
blur = false

[[window_rule]]
match.title = [".*YouTube.*", "^Netflix.*"]
opacity = 1.0
blur = false

