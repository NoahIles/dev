stream.rules = [
  # Comms → Rode A (AUX6-7)
  {
    matches = [ { application.name = "WEBRTC VoiceEngine" } ]
    actions = { update-props = { node.target = "Rode_A_Out" } }
  }
  {
    matches = [ { application.name = "vesktop" } ]
    actions = { update-props = { node.target = "Rode_A_Out" } }
  }
  {
    matches = [ { application.name = "TeamSpeak" } ]
    actions = { update-props = { node.target = "Rode_A_Out" } }
  }

  # Media → Rode Music (AUX4-5)
  {
    matches = [ { application.name = "Chromium" } ]
    actions = { update-props = { node.target = "Rode_Music_Out" } }
  }
  {
    matches = [ { application.process.binary = "spotify" } ]
    actions = { update-props = { node.target = "Rode_Music_Out" } }
  }
  {
    matches = [ { application.name = "mpv" } ]
    actions = { update-props = { node.target = "Rode_Music_Out" } }
  }

  # Games → Rode Game (AUX2-3)
  # Wine/Proton executables
  {
    matches = [ { application.process.binary = "~.*\\.exe$" } ]
    actions = { update-props = { node.target = "Rode_Game_Out" } }
  }
  # Java (Minecraft)
  {
    matches = [ { application.process.binary = "java" } ]
    actions = { update-props = { node.target = "Rode_Game_Out" } }
  }
]
