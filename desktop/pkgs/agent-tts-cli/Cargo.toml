[package]
name = "agent-tts"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1"
shlex = "1"
# No TLS, gzip or cookies: both daemons are plain HTTP on localhost.
ureq = { version = "3", default-features = false }

[lints.rust]
unsafe_code = "forbid"

# A hook that panics is worse than one that stays silent, so every way to
# panic is a build error (the Nix build runs clippy with -D warnings).
[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
